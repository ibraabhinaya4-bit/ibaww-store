<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricelist Digital Aplikasi Premium</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: {
                            400: '#d7aa4e',
                            500: '#c59b27',
                            600: '#a37c1d',
                        },
                        purple: {
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                        },
                        dark: {
                            900: '#07070a',
                            800: '#111116',
                            700: '#1b1b22',
                            600: '#272732',
                        }
                    },
                    fontFamily: {
                        sans: ['Outfit', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Outfit', 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(17, 17, 22, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(139, 92, 246, 0.15);
        }
        .purple-glow {
            box-shadow: 0 0 40px -10px rgba(124, 58, 237, 0.25);
        }
        .purple-gradient {
            background: linear-gradient(135deg, #a78bfa 0%, #7c3aed 50%, #5b21b6 100%);
        }
        .gold-purple-gradient {
            background: linear-gradient(135deg, #f5ebd3 0%, #d7aa4e 40%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #07070a; }
        ::-webkit-scrollbar-thumb { background: #272732; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #7c3aed; }
    </style>
</head>
<body class="bg-dark-900 text-gray-100 min-h-screen flex flex-col selection:bg-purple-600 selection:text-white">

    <!-- Toast Notification -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <!-- MAIN APP CONTAINER -->
    <div id="app" class="flex-1 flex flex-col">
        <!-- Rendered dynamically -->
    </div>

    <!-- MODAL CONTAINER -->
    <div id="modal-container" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/85 backdrop-blur-sm"></div>

    <!-- SCRIPT APPLICATION LOGIC -->
    <script>
        // --- INITIAL DATA & STORAGE SETUP ---

        const DEFAULT_APPS = [

                    { id: "nf-full", name: "1 Bulan (Private Profile)", price: 55000, originalPrice: 186000, desc: "Full private pakai PIN sendiri." }
                ]
            },
            {
                id: "canva",
                name: "Canva Pro Team",
                category: "Design Tools",

                isActive: true,
                order: 2,
                packages: [
                    { id: "cv-1m", name: "Canva Pro 1 Bulan", price: 15000, originalPrice: 50000, desc: "Garansi 1 bulan full." },
                    { id: "cv-1y", name: "Canva Pro 1 Tahun", price: 35000, originalPrice: 150000, desc: "Akses tim resmi 1 tahun." },
                    { id: "cv-life", name: "Canva Pro Lifetime", price: 75000, originalPrice: 300000, desc: "Garansi lifetime anti ngadat." }
                ]
            },
            {
                id: "spotify",
                name: "Spotify Premium",
                category: "Music & Audio",
                logo: "🎵",
                iconBg: "from-emerald-600 to-green-900",
                badge: "POPULAR",
                description: "Spotify Individual Premium invite email pribadi. Bebas iklan & bebas download.",
                isActive: true,
                order: 3,
                packages: [
                    { id: "sp-1m", name: "1 Bulan Individual", price: 25000, originalPrice: 54990, desc: "Invite email pribadi." },
                    { id: "sp-3m", name: "3 Bulan Individual", price: 65000, originalPrice: 160000, desc: "Lebih hemat 3 bulan." }
                ]
            },
            {
                id: "youtube",
                name: "YouTube Premium",
                category: "Streaming",
                logo: "▶️",
                iconBg: "from-red-700 to-rose-900",
                badge: "BEST SELLER",
                description: "Nonton YouTube tanpa iklan sepuasnya + Free YouTube Music.",
                isActive: true,
                order: 4,
                packages: [
                    { id: "yt-1m", name: "1 Bulan (Famplan)", price: 12000, originalPrice: 59000, desc: "Legal via invite keluarga." },
                    { id: "yt-4m", name: "4 Bulan (Famplan)", price: 30000, originalPrice: 238000, desc: "Hemat 4 bulan full garansi." }
                ]
            },
            {
                id: "chatgpt",
                name: "ChatGPT Plus AI",
                category: "AI & Productivity",
                logo: "🤖",
                iconBg: "from-teal-600 to-cyan-900",
                badge: "NEW",
                description: "Akses GPT-4o, DALL-E 3, dan analisis data canggih kecepatan tinggi.",
                isActive: true,
                order: 5,
                packages: [
                    { id: "ai-shar", name: "1 Bulan (Shared Account)", price: 90000, originalPrice: 300000, desc: "Login bergantian stabil." },
                    { id: "ai-priv", name: "1 Bulan (Private Account)", price: 220000, originalPrice: 350000, desc: "Akun baru privat utuh." }
                ]
            },
            {
                id: "capcut",
                name: "CapCut Pro",
                category: "Video Editor",
                logo: "✂️",
                iconBg: "from-slate-700 to-zinc-900",
                badge: "",
                description: "Buka semua efek, template pro, dan transisi eksklusif CapCut.",
                isActive: true,
                order: 6,
                packages: [
                    { id: "cc-1m", name: "CapCut Pro 1 Bulan", price: 20000, originalPrice: 80000, desc: "Login device siap pakai." },
                    { id: "cc-1y", name: "CapCut Pro 1 Tahun", price: 95000, originalPrice: 350000, desc: "Full 1 tahun garansi." }
                ]
            },
            {
                id: "viu",
                name: "Viu Premium",
                category: "Streaming",
                logo: "🍿",
                iconBg: "from-yellow-600 to-amber-900",
                badge: "",
                description: "Nonton drakor dan anime sepuasnya tanpa iklan, kualitas HD.",
                isActive: true,
                order: 7,
                packages: [
                    { id: "viu-1m", name: "Viu 1 Bulan", price: 10000, originalPrice: 33000, desc: "Legal & resmi." },
                    { id: "viu-1y", name: "Viu 1 Tahun", price: 60000, originalPrice: 200000, desc: "Hemat setahun." }
                ]
            },
            {
                id: "telegram",
                name: "Telegram Premium",
                category: "Social Media",
                logo: "✈️",
                iconBg: "from-sky-600 to-blue-900",
                badge: "POPULAR",
                description: "Upload file besar 4GB, kecepatan download maksimal, stiker eksklusif.",
                isActive: true,
                order: 8,
                packages: [
                    { id: "tg-1m", name: "Telegram 1 Bulan", price: 45000, originalPrice: 79000, desc: "Gift resmi via username." },
                    { id: "tg-1y", name: "Telegram 1 Tahun", price: 320000, originalPrice: 450000, desc: "Lebih hemat setahun." }
                ]
            }
        ];

        // Storage helpers
        function getStoreData() {
            const data = localStorage.getItem('luxe_store_v2');
            return data ? JSON.parse(data) : DEFAULT_STORE;
        }
        function saveStoreData(data) {
            data.lastUpdated = new Date().toISOString();
            localStorage.setItem('luxe_store_v2', JSON.stringify(data));
        }

        function getAppsData() {
            const data = localStorage.getItem('luxe_apps_v2');
            return data ? JSON.parse(data) : DEFAULT_APPS;
        }
        function saveAppsData(apps) {
            localStorage.setItem('luxe_apps_v2', JSON.stringify(apps));
        }

        // App State
        let currentRoute = { view: 'home', appId: null }; // views: 'home', 'detail', 'admin-login', 'admin-dashboard'
        let searchQuery = '';
        let selectedCategory = 'Semua';
        let isAdminLoggedIn = localStorage.getItem('luxe_admin_auth') === 'true';
        let adminTab = 'apps'; // 'apps', 'settings'

        // Utils
        function formatRupiah(num) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);
        }
        function formatDate(iso) {
            return new Date(iso).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }
        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            const bg = type === 'success' ? 'bg-purple-600 text-white border-purple-400' : 'bg-red-600 text-white border-red-500';
            el.className = `${bg} px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 font-medium text-sm border pointer-events-auto transform translate-y-2 opacity-0 transition-all duration-300`;
            el.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle-2' : 'alert-circle'}" class="w-5 h-5 shrink-0"></i><span>${msg}</span>`;
            container.appendChild(el);
            lucide.createIcons();
            setTimeout(() => el.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                el.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => el.remove(), 300);
            }, 3000);
        }

        // Router
        function navigate(view, appId = null) {
            currentRoute = { view, appId };
            window.scrollTo({ top: 0, behavior: 'smooth' });
            render();
        }

        function render() {
            const root = document.getElementById('app');
            root.innerHTML = '';

            if (currentRoute.view === 'home') {
                root.innerHTML = renderHomeView();
            } else if (currentRoute.view === 'detail') {
                root.innerHTML = renderDetailView(currentRoute.appId);
            } else if (currentRoute.view === 'admin-login') {
                root.innerHTML = renderAdminLoginView();
            } else if (currentRoute.view === 'admin-dashboard') {
                if (!isAdminLoggedIn) {
                    navigate('admin-login');
                    return;
                }
                root.innerHTML = renderAdminDashboardView();
            }
            lucide.createIcons();
        }

        // --- 1. HOME VIEW (Katalog & Kategori) ---
        function renderHomeView() {
            const store = getStoreData();
            let apps = getAppsData().filter(a => a.isActive);

            // Extract categories
            const categories = ['Semua', ...new Set(apps.map(a => a.category))];

            // Filter by category
            if (selectedCategory !== 'Semua') {
                apps = apps.filter(a => a.category === selectedCategory);
            }

            // Filter by search
            if (searchQuery.trim() !== '') {
                const q = searchQuery.toLowerCase();
                apps = apps.filter(a => a.name.toLowerCase().includes(q) || a.description.toLowerCase().includes(q));
            }

            apps.sort((a, b) => a.order - b.order);

            return `
                <!-- Navbar -->
                <header class="sticky top-0 z-40 bg-dark-900/90 backdrop-blur-md border-b border-dark-700">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                        <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('home')">
                            <div class="w-12 h-12 rounded-2xl purple-gradient flex items-center justify-center text-2xl shadow-lg shadow-purple-600/20">
                                ${store.logo || '👑'}
                            </div>
                            <div>
                                <h1 class="font-bold text-lg sm:text-xl tracking-tight text-white flex items-center gap-2">
                                    ${store.name}
                                    <span class="text-[10px] px-2 py-0.5 rounded-full bg-purple-500/20 text-purple-300 border border-purple-500/30 font-semibold">PREMIUM</span>
                                </h1>
                                <p class="text-xs text-gray-400 hidden sm:block">${store.tagline}</p>
                            </div>
                        </div>

                        <div class="flex items-center gap-3">
                            <button onclick="openContactModal()" class="hidden sm:flex items-center gap-2 px-4 py-2 rounded-xl bg-dark-800 hover:bg-dark-700 text-gray-300 hover:text-white border border-dark-600 text-sm font-medium transition-all">
                                <i data-lucide="info" class="w-4 h-4 text-purple-400"></i> Kontak Admin
                            </button>
                            <button onclick="navigate('admin-login')" class="flex items-center gap-2 px-4 py-2 rounded-xl purple-gradient text-white font-semibold text-sm transition-all shadow-lg shadow-purple-600/20 hover:opacity-95">
                                <i data-lucide="shield-check" class="w-4 h-4"></i> Admin Login
                            </button>
                        </div>
                    </div>
                </header>

                <!-- Hero Section -->
                <section class="relative overflow-hidden py-14 lg:py-20 border-b border-dark-700 bg-gradient-to-b from-dark-800/80 to-dark-900">
                    <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#8b5cf6_1px,transparent_1px)] [background-size:20px_20px] pointer-events-none"></div>
                    <div class="max-w-4xl mx-auto px-4 sm:px-6 text-center relative z-10">
                        <span class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-purple-500/10 text-purple-300 border border-purple-500/30 mb-4">
                            <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> PRICELIST PREMIUM APPS & LAYANAN DIGITAL
                        </span>
                        <h2 class="text-3xl sm:text-5xl font-extrabold text-white tracking-tight mb-4">
                            Pusat Langganan Aplikasi <span class="gold-purple-gradient">Legal & Termurah</span>
                        </h2>
                        <p class="text-gray-400 max-w-xl mx-auto text-sm sm:text-base mb-8">
                            Pilih aplikasi digital favorit Anda di bawah ini untuk melihat daftar paket harga lengkap dan pesan langsung via WhatsApp.
                        </p>

                        <!-- Search Bar -->
                        <div class="max-w-xl mx-auto relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                                <i data-lucide="search" class="w-5 h-5 text-purple-400"></i>
                            </div>
                            <input type="text" id="search-input" value="${searchQuery}" oninput="handleSearch(event)" placeholder="Cari aplikasi (Netflix, Canva, Spotify...)" class="w-full pl-12 pr-10 py-4 rounded-2xl bg-dark-800 border border-dark-600 text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 text-sm sm:text-base shadow-xl">
                            ${searchQuery ? `
                                <button onclick="clearSearch()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-white">
                                    <i data-lucide="x" class="w-5 h-5"></i>
                                </button>
                            ` : ''}
                        </div>
                    </div>
                </section>

                <!-- Content Area -->
                <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
                    
                    <!-- Categories Tabs -->
                    <div class="flex items-center gap-2 overflow-x-auto pb-4 mb-8 no-scrollbar">
                        ${categories.map(cat => `
                            <button onclick="selectCategory('${cat}')" class="px-5 py-2.5 rounded-xl font-medium text-sm whitespace-nowrap transition-all flex items-center gap-2 ${selectedCategory === cat ? 'purple-gradient text-white font-semibold shadow-lg shadow-purple-600/25' : 'bg-dark-800 text-gray-400 hover:text-white border border-dark-700'}">
                                ${cat}
                            </button>
                        `).join('')}
                    </div>

                    <!-- Apps Grid -->
                    ${apps.length === 0 ? `
                        <div class="text-center py-20 glass-panel rounded-3xl">
                            <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-dark-700 flex items-center justify-center text-purple-400">
                                <i data-lucide="package-search" class="w-8 h-8"></i>
                            </div>
                            <h3 class="text-lg font-bold text-white mb-1">Aplikasi Tidak Ditemukan</h3>
                            <p class="text-gray-400 text-sm mb-6">Coba kata kunci lain atau pilih kategori berbeda.</p>
                            <button onclick="resetHomeFilter()" class="px-5 py-2.5 rounded-xl purple-gradient text-white font-semibold text-sm">Reset Filter</button>
                        </div>
                    ` : `
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                            ${apps.map(app => {
                                const minPrice = app.packages && app.packages.length > 0 ? Math.min(...app.packages.map(p => p.price)) : 0;
                                return `
                                    <div onclick="navigate('detail', '${app.id}')" class="glass-panel rounded-3xl p-6 flex flex-col justify-between cursor-pointer group hover:border-purple-500/50 transition-all duration-300 hover:shadow-2xl hover:shadow-purple-600/10 hover:-translate-y-1 relative overflow-hidden">
                                        ${app.badge ? `
                                            <div class="absolute top-4 right-4">
                                                <span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-purple-500/20 text-purple-300 border border-purple-500/30">
                                                    ${app.badge}
                                                </span>
                                            </div>
                                        ` : ''}

                                        <div>
                                            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br ${app.iconBg || 'from-purple-600 to-indigo-900'} flex items-center justify-center text-3xl mb-4 shadow-lg shadow-purple-600/20 group-hover:scale-110 transition-transform">
                                                ${app.logo || '📱'}
                                            </div>

                                            <span class="text-[11px] font-semibold text-purple-400 uppercase tracking-wider block mb-1">${app.category}</span>
                                            <h3 class="font-bold text-lg text-white group-hover:text-purple-300 transition-colors mb-2">${app.name}</h3>
                                            <p class="text-gray-400 text-xs leading-relaxed line-clamp-2 mb-4">${app.description}</p>
                                        </div>

                                        <div class="pt-4 border-t border-dark-700 flex items-center justify-between">
                                            <div>
                                                <span class="text-[10px] text-gray-500 block">Mulai Dari</span>
                                                <span class="font-extrabold text-white text-sm sm:text-base">${minPrice ? formatRupiah(minPrice) : 'Cek Detail'}</span>
                                            </div>
                                            <span class="w-9 h-9 rounded-xl bg-dark-800 group-hover:bg-purple-600 text-gray-300 group-hover:text-white flex items-center justify-center transition-colors">
                                                <i data-lucide="arrow-right" class="w-4 h-4"></i>
                                            </span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `}
                </main>

                <!-- Footer -->
                <footer class="bg-dark-800 border-t border-dark-700 mt-20 py-10">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-center sm:text-left">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl purple-gradient flex items-center justify-center text-xl">
                                ${store.logo || '👑'}
                            </div>
                            <div>
                                <h4 class="font-bold text-white text-sm">${store.name}</h4>
                                <p class="text-xs text-gray-400">Pricelist Digital Resmi & Terpercaya.</p>
                            </div>
                        </div>
                        <div class="text-xs text-gray-500">
                            Terakhir diperbarui: <span class="text-gray-300">${formatDate(store.lastUpdated)}</span>
                        </div>
                    </div>
                </footer>
            `;
        }

        // --- 2. DETAIL VIEW (Halaman Detail Aplikasi & Paket Harga) ---
        function renderDetailView(appId) {
            const store = getStoreData();
            const apps = getAppsData();
            const app = apps.find(a => a.id === appId);

            if (!app) {
                return `
                    <div class="min-h-screen flex items-center justify-center p-4 text-center">
                        <div>
                            <h2 class="text-2xl font-bold text-white mb-2">Aplikasi Tidak Ditemukan</h2>
                            <p class="text-gray-400 text-sm mb-6">Aplikasi yang Anda cari mungkin sudah dihapus atau tidak aktif.</p>
                            <button onclick="navigate('home')" class="px-5 py-2.5 rounded-xl purple-gradient text-white font-semibold text-sm">Kembali ke Beranda</button>
                        </div>
                    </div>
                `;
            }

            return `
                <!-- Navbar Detail -->
                <header class="sticky top-0 z-40 bg-dark-900/90 backdrop-blur-md border-b border-dark-700">
                    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
                        <button onclick="navigate('home')" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-dark-800 hover:bg-dark-700 text-gray-300 hover:text-white text-sm font-medium transition-all">
                            <i data-lucide="arrow-left" class="w-4 h-4 text-purple-400"></i>
                            Kembali ke Katalog
                        </button>

                        <div class="flex items-center gap-2">
                            <button onclick="openContactModal()" class="flex items-center gap-2 px-4 py-2 rounded-xl purple-gradient text-white text-sm font-semibold shadow-lg shadow-purple-600/20">
                                <i data-lucide="message-circle" class="w-4 h-4"></i> Tanya Admin
                            </button>
                        </div>
                    </div>
                </header>

                <main class="flex-1 max-w-4xl mx-auto px-4 sm:px-6 py-10 w-full">
                    
                    <!-- App Info Card -->
                    <div class="glass-panel rounded-3xl p-6 sm:p-8 mb-8 relative overflow-hidden border border-purple-500/20">
                        <div class="flex flex-col sm:flex-row items-center sm:items-start gap-6 text-center sm:text-left">
                            <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-3xl bg-gradient-to-br ${app.iconBg || 'from-purple-600 to-indigo-900'} flex items-center justify-center text-4xl sm:text-5xl shadow-xl shadow-purple-600/30 shrink-0">
                                ${app.logo || '📱'}
                            </div>
                            <div class="flex-1">
                                <div class="flex items-center justify-center sm:justify-start gap-3 mb-2">

        function copyPkg(title, price) {
            const text = `Paket ${title}: ${formatRupiah(price)}`;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => showToast('Harga paket disalin!', 'success'));
            } else {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast('Harga paket disalin!', 'success');
            }
        }

        }

        function handleSaveApp(e, appId) {
            e.preventDefault();
            let apps = getAppsData();
            const name = document.getElementById('app-name').value;
            const category = document.getElementById('app-category').value;
            const badge = document.getElementById('app-badge').value;
            const logo = document.getElementById('app-logo').value;
            const description = document.getElementById('app-desc').value;
            const order = Number(document.getElementById('app-order').value);

            if (appId) {
                apps = apps.map(a => a.id === appId ? { ...a, name, category, badge, logo, description, order } : a);
            } else {
                const id = document.getElementById('app-id-input').value.trim().toLowerCase().replace(/\s+/g, '-');
                if (apps.some(a => a.id === id)) {
                    showToast('ID Aplikasi sudah digunakan!', 'error');
                    return;
                }
                apps.push({
                    id, name, category, badge, logo, description, order,
                    iconBg: 'from-purple-600 to-indigo-900',
                    isActive: true,
                    packages: []
                });
            }

            saveAppsData(apps);
            const store = getStoreData();
            saveStoreData(store);
            closeModal();
            showToast('Aplikasi berhasil disimpan!', 'success');
            render();
        }

        // --- PACKAGES MANAGER MODAL ---
        function openPackagesManager(appId) {
            const apps = getAppsData();
            const app = apps.find(a => a.id === appId);

            openModal(`
                <div class="flex items-center justify-between mb-6 pb-4 border-b border-dark-700">
                    <div>
                        <h3 class="text-xl font-bold text-white">Kelola Paket: ${app.name}</h3>
                        <p class="text-xs text-gray-400">Tambah atau hapus paket harga spesifik aplikasi ini.</p>
                    </div>
                    <button onclick="openPackageFormModal('${appId}')" class="px-4 py-2 rounded-xl purple-gradient text-white font-bold text-xs shadow-md flex items-center gap-1.5">
                        <i data-lucide="plus" class="w-4 h-4"></i> Tambah Paket
                    </button>
                </div>

                <div class="space-y-3 max-h-[60vh] overflow-y-auto pr-1">
                    ${!app.packages || app.packages.length === 0 ? `
                        <div class="text-center py-10 bg-dark-800/50 rounded-2xl border border-dark-700">
                            <p class="text-gray-400 text-xs">Belum ada paket harga. Klik tombol di atas untuk menambah.</p>
                        </div>
                    ` : app.packages.map(pkg => `
                        <div class="glass-panel p-4 rounded-2xl flex items-center justify-between border border-dark-700">
                            <div>
                                <h4 class="font-bold text-white text-sm">${pkg.name}</h4>
                                <div class="flex items-center gap-3 text-xs mt-1">
                                    <span class="text-purple-400 font-bold">${formatRupiah(pkg.price)}</span>
                                    ${pkg.originalPrice ? `<span class="text-gray-500 line-through">${formatRupiah(pkg.originalPrice)}</span>` : ''}
                                </div>
                                <p class="text-[11px] text-gray-400 mt-1">${pkg.desc || ''}</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="deletePackage('${appId}', '${pkg.id}')" class="p-2 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `);
        }

        function openPackageFormModal(appId, pkgId = null) {
            openModal(`
                <h3 class="text-xl font-bold text-white mb-4">Tambah Paket Harga</h3>
                <form onsubmit="handleSavePackage(event, '${appId}')" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">Nama Paket / Durasi</label>
                        <input type="text" id="pkg-name" required placeholder="Cth: 1 Bulan (1 User)" class="w-full px-4 py-3 rounded-xl bg-dark-800 border border-dark-600 text-white text-sm focus:outline-none focus:border-purple-500">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">Harga Jual (Rp)</label>
                            <input type="number" id="pkg-price" required class="w-full px-4 py-3 rounded-xl bg-dark-800 border border-dark-600 text-white text-sm font-mono focus:outline-none focus:border-purple-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">Harga Coret (Opsional)</label>
                            <input type="number" id="pkg-orig" class="w-full px-4 py-3 rounded-xl bg-dark-800 border border-dark-600 text-white text-sm font-mono focus:outline-none focus:border-purple-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">Keterangan / Garansi</label>
                        <input type="text" id="pkg-desc" placeholder="Cth: Garansi full 30 hari anti ngadat" class="w-full px-4 py-3 rounded-xl bg-dark-800 border border-dark-600 text-white text-sm focus:outline-none focus:border-purple-500">
                    </div>
                    <div class="flex justify-end gap-3 pt-4 border-t border-dark-700">
                        <button type="button" onclick="openPackagesManager('${appId}')" class="px-5 py-2.5 rounded-xl bg-dark-800 text-gray-300 text-sm">Kembali</button>
                        <button type="submit" class="px-6 py-2.5 rounded-xl purple-gradient text-white font-bold text-sm shadow-lg shadow-purple-600/30">Simpan Paket</button>
                    </div>
                </form>
            `);
        }

        function handleSavePackage(e, appId) {
            e.preventDefault();
            let apps = getAppsData();
            const name = document.getElementById('pkg-name').value;
            const price = Number(document.getElementById('pkg-price').value);
            const originalPrice = Number(document.getElementById('pkg-orig').value) || 0;
            const desc = document.getElementById('pkg-desc').value;

            apps = apps.map(a => {
                if (a.id === appId) {
                    if (!a.packages) a.packages = [];
                    a.packages.push({
                        id: 'pkg-' + Date.now(),
                        name, price, originalPrice, desc
                    });
                }
                return a;
            });

            saveAppsData(apps);
            const store = getStoreData();
            saveStoreData(store);
            showToast('Paket berhasil ditambahkan!', 'success');
            openPackagesManager(appId);
        }

        function deletePackage(appId, pkgId) {
            if (confirm('Yakin ingin menghapus paket harga ini?')) {
                let apps = getAppsData();
                apps = apps.map(a => {
                    if (a.id === appId) {
                        a.packages = a.packages.filter(p => p.id !== pkgId);
                    }
                    return a;
                });
                saveAppsData(apps);
                showToast('Paket berhasil dihapus', 'success');
                openPackagesManager(appId);
            }
        }

        function handleSaveSettings(e) {
            e.preventDefault();
            let store = getStoreData();
            store.name = document.getElementById('set-name').value;
            store.tagline = document.getElementById('set-tagline').value;
            store.whatsapp = document.getElementById('set-wa').value.replace(/[^0-9]/g, '');
            store.logo = document.getElementById('set-logo').value;

            saveStoreData(store);
            showToast('Pengaturan toko diperbarui!', 'success');
            render();
        }

        // --- INIT ---
        window.onload = function() {
            if (!localStorage.getItem('luxe_store_v2')) saveStoreData(DEFAULT_STORE);
            if (!localStorage.getItem('luxe_apps_v2')) saveAppsData(DEFAULT_APPS);
            render();
        }
    </script>
</body>
</html>
